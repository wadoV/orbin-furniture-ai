<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbin AI v4.6 — Generador de Artefactos</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0D0D0D;color:#ddd;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
    .card{background:#1a1a1a;border:1px solid #333;border-radius:20px;padding:36px;max-width:520px;width:100%;box-shadow:0 0 60px rgba(245,166,35,0.08)}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
    .logo-icon{width:36px;height:36px;background:#F5A623;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:15px}
    .logo-text{font-weight:900;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#fff}
    .badge{font-size:9px;background:#F5A623;color:#000;padding:2px 8px;border-radius:20px;font-weight:900;margin-left:8px;letter-spacing:1px}
    h2{font-size:18px;font-weight:800;color:#fff;margin-bottom:6px}
    .subtitle{font-size:12px;color:#888;margin-bottom:28px;line-height:1.5}
    .company-row{background:#1f1a0a;border:1px solid #F5A62330;border-radius:12px;padding:10px 16px;margin-bottom:24px;display:flex;align-items:center;gap:8px;font-size:12px;color:#F5A623;font-weight:700}
    .btn-group{display:flex;flex-direction:column;gap:12px}
    button{width:100%;padding:14px 20px;border:none;border-radius:14px;cursor:pointer;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:10px;transition:all .2s;position:relative;overflow:hidden}
    button:disabled{opacity:.4;cursor:not-allowed}
    .btn-pdf{background:linear-gradient(135deg,#3a2000,#1a1200);border:1px solid #F5A62350;color:#F5A623}
    .btn-pdf:hover:not(:disabled){border-color:#F5A623;box-shadow:0 0 16px rgba(245,166,35,.2)}
    .btn-thermal{background:linear-gradient(135deg,#1a0030,#0d0018);border:1px solid #a855f750;color:#c084fc}
    .btn-thermal:hover:not(:disabled){border-color:#a855f7;box-shadow:0 0 16px rgba(168,85,247,.2)}
    .btn-csv{background:linear-gradient(135deg,#001a10,#000d08);border:1px solid #10b98150;color:#34d399}
    .btn-csv:hover:not(:disabled){border-color:#10b981;box-shadow:0 0 16px rgba(16,185,129,.2)}
    .btn-all{background:linear-gradient(135deg,#F5A623,#e08800);color:#000;border:none;margin-top:4px}
    .btn-all:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 20px rgba(245,166,35,.3)}
    .icon{font-size:16px;flex-shrink:0}
    .ext{margin-left:auto;font-size:8px;background:rgba(255,255,255,.1);padding:2px 6px;border-radius:6px;letter-spacing:2px}
    .log{margin-top:20px;background:#0a0a0a;border:1px solid #222;border-radius:12px;padding:14px;font-family:monospace;font-size:11px;color:#888;max-height:120px;overflow-y:auto;min-height:40px}
    .log .ok{color:#4ade80} .log .err{color:#f87171} .log .info{color:#F5A623}
    footer{margin-top:20px;font-size:10px;color:#555;text-align:center}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">O</div>
    <div class="logo-text">Orbin AI<span class="badge">v4.6</span></div>
  </div>
  <h2>Generador de Artefactos</h2>
  <p class="subtitle">Genera y descarga los 3 documentos de producción industrial offline — sin servidor requerido.</p>

  <div class="company-row">
    <span>&#127970;</span>
    <span id="company-label">Marcenaria Orbin Pro — Plan Enterprise</span>
  </div>

  <div class="btn-group">
    <button class="btn-pdf" onclick="genPDF()" id="btn-pdf">
      <span class="icon">&#128196;</span> Plano Ejecutivo 2D <span class="ext">.PDF A4</span>
    </button>
    <button class="btn-thermal" onclick="genThermal()" id="btn-thermal">
      <span class="icon">&#127991;</span> Etiquetas de Corte Térmicas <span class="ext">.PDF</span>
    </button>
    <button class="btn-csv" onclick="genCSV()" id="btn-csv">
      <span class="icon">&#128202;</span> Lista de Corte Neta <span class="ext">.CSV</span>
    </button>
    <button class="btn-all" onclick="genAll()" id="btn-all">
      &#9889; Generar y Descargar los 3 Archivos
    </button>
  </div>
  <div class="log" id="log"><span class="info">» Listo para generar.</span></div>
</div>
<footer>Orbin AI v4.6 COMMERCIAL_READY · Marcenaria Orbin Pro · demo@orbin-industrial.dev</footer>

<script>
const COMPANY = 'Marcenaria Orbin Pro';
const EMAIL   = 'demo@orbin-industrial.dev';
const GOLD    = [245, 166, 35];
const DARK    = [13, 13, 13];
const WHITE   = [220, 220, 220];
const MUTED   = [120, 120, 120];

// Demo kitchen module — cocina base 3 módulos
const MODULES = [
  { id:'MOD-COCINA-001', type:'base', configuration:{ moduleType:'base', width:600, height:870, depth:580, thickness:18, backThickness:6, numShelves:1, numDrawers:2, drawerHeight:180, hasCountertop:true, baseboard:true, baseboardHeight:100, materialBody:'oak_light', materialFront:'white' }},
  { id:'MOD-COCINA-002', type:'base', configuration:{ moduleType:'base', width:900, height:870, depth:580, thickness:18, backThickness:6, numShelves:0, numDrawers:3, drawerHeight:200, hasCountertop:true, baseboard:true, baseboardHeight:100, materialBody:'oak_light', materialFront:'white' }},
  { id:'MOD-COCINA-003', type:'wall', configuration:{ moduleType:'wall', width:600, height:720, depth:350, thickness:18, backThickness:6, numShelves:2, hasDoors:true, numDoors:2, materialBody:'oak_light', materialFront:'white' }},
];

function log(msg, type='ok') {
  const el = document.getElementById('log');
  el.innerHTML += `<br><span class="${type}">» ${msg}</span>`;
  el.scrollTop = el.scrollHeight;
}

function extractPieces(modules) {
  const pieces = [];
  modules.forEach(mod => {
    const cfg = mod.configuration; if (!cfg) return;
    const W=cfg.width||600, H=cfg.height||870, D=cfg.depth||580;
    const T=cfg.thickness||18, BT=cfg.backThickness||6;
    const push = (name,w,h,t,type,mat) => pieces.push({moduleId:mod.id,name,w,h,t,type,material:mat||'MDP'});
    push('Lateral Izquierdo',D,H,T,'structural');
    push('Lateral Derecho',D,H,T,'structural');
    push('Tapa Superior',W-2*T,D,T,'structural');
    push('Base',W-2*T,D,T,'structural');
    push('Fondo HDF',W,H,BT,'structural','HDF');
    for(let s=0;s<(cfg.numShelves||0);s++) push(`Estante ${s+1}`,W-2*T,D-20,T,'shelf');
    for(let d=0;d<(cfg.numDrawers||0);d++){
      const dH=cfg.drawerHeight||180;
      push(`Frente Cajón ${d+1}`,W-2*T-6,dH,T,'drawer_front');
      push(`Caja Cajón L${d+1}`,D-50,dH-30,15,'drawer_box','MDF');
      push(`Caja Cajón R${d+1}`,D-50,dH-30,15,'drawer_box','MDF');
      push(`Fondo Cajón ${d+1}`,W-2*T-34,D-52,6,'drawer_bottom','HDF');
    }
    if(cfg.hasDoors) for(let dr=0;dr<(cfg.numDoors||2);dr++)
      push(`Puerta ${dr+1}`,Math.floor((W-2*T)/(cfg.numDoors||2)),H-100,T,'door');
    if(cfg.hasCountertop) push('Encimera',W,D+50,38,'countertop','MDF 38mm');
  });
  return pieces;
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ── 1. PDF Plano Ejecutivo 2D ──────────────────────────────────────────────
function genPDF() {
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
    const PW=doc.internal.pageSize.getWidth(), PH=doc.internal.pageSize.getHeight();
    const pieces = extractPieces(MODULES);

    doc.setFillColor(...DARK); doc.rect(0,0,PW,PH,'F');
    doc.setDrawColor(...GOLD); doc.setLineWidth(0.8); doc.rect(5,5,PW-10,PH-10);
    doc.setDrawColor(180,120,20); doc.setLineWidth(0.3); doc.rect(7,7,PW-14,PH-14);

    [[3,3],[PW-3,3],[3,PH-3],[PW-3,PH-3]].forEach(([cx,cy])=>{
      const hd=cx<PW/2?1:-1, vd=cy<PH/2?1:-1;
      doc.setDrawColor(...GOLD); doc.setLineWidth(0.5);
      doc.line(cx,cy,cx+hd*6,cy); doc.line(cx,cy,cx,cy+vd*6);
    });

    doc.setFontSize(6); doc.setTextColor(...MUTED);
    doc.text('PLANO EJECUTIVO DE FABRICACIÓN — ORBIN AI v4.6', PW/2,13,{align:'center'});
    doc.setFontSize(14); doc.setTextColor(...GOLD); doc.setFont(undefined,'bold');
    doc.text(COMPANY.toUpperCase(), PW/2,21,{align:'center'});
    doc.setFontSize(6.5); doc.setTextColor(...MUTED); doc.setFont(undefined,'normal');
    doc.text(`Generado: ${new Date().toLocaleString()}   ·   ${EMAIL}   ·   3 módulos / ${pieces.length} piezas`, PW/2,27,{align:'center'});
    doc.setDrawColor(...GOLD); doc.setLineWidth(0.25); doc.line(12,30,PW-12,30);

    let yPos=35;
    MODULES.forEach((mod,mi)=>{
      const cfg=mod.configuration||{};
      const W=cfg.width||600, H=cfg.height||870, D=cfg.depth||580;
      doc.setFontSize(7); doc.setTextColor(...GOLD); doc.setFont(undefined,'bold');
      doc.text(`MÓDULO ${mi+1} — ${(cfg.moduleType||'BASE').toUpperCase()}`, 12, yPos);
      doc.setTextColor(...WHITE); doc.setFont(undefined,'normal'); doc.setFontSize(6.5);
      doc.text(`${W}mm × ${H}mm × ${D}mm  ·  Esp: ${cfg.thickness||18}mm  ·  Material: ${cfg.materialBody||'oak_light'}`, 12, yPos+5);
      yPos+=11;

      const SC=0.028, T=(cfg.thickness||18)*SC;
      const dW=W*SC, dH=H*SC, ox=12, oy=yPos;
      doc.setDrawColor(...GOLD); doc.setLineWidth(0.3); doc.rect(ox,oy,dW,dH);
      doc.setDrawColor(180,120,20); doc.setLineWidth(0.15);
      doc.line(ox,oy+T,ox+dW,oy+T);
      doc.line(ox,oy+dH-T,ox+dW,oy+dH-T);
      doc.line(ox+T,oy,ox+T,oy+dH);
      doc.line(ox+dW-T,oy,ox+dW-T,oy+dH);
      doc.setLineDashPattern([0.8,0.8],0);
      doc.line(ox+T+1.5,oy,ox+T+1.5,oy+dH);
      doc.setLineDashPattern([],0);
      const ns=cfg.numShelves||0;
      if(ns>0){
        const sp=(dH-2*T)/(ns+1);
        doc.setLineDashPattern([0.6,0.6],0); doc.setDrawColor(...MUTED);
        for(let s=1;s<=ns;s++) doc.line(ox+T+1.5,oy+T+sp*s,ox+dW-T,oy+T+sp*s);
        doc.setLineDashPattern([],0);
      }
      doc.setFontSize(4.5); doc.setTextColor(...GOLD);
      doc.text(`${W}`, ox+dW/2, oy+dH+3.5, {align:'center'});
      doc.text(`${H}`, ox+dW+1.5, oy+dH/2);
      yPos += dH + 8;
    });

    doc.setDrawColor(...GOLD); doc.setLineWidth(0.25); doc.line(12,yPos,PW-12,yPos); yPos+=5;
    doc.setFontSize(7); doc.setTextColor(...GOLD); doc.setFont(undefined,'bold');
    doc.text('RESUMEN DE PIEZAS', 12, yPos); yPos+=3;

    doc.autoTable({
      startY: yPos, margin:{left:12,right:12},
      head:[['#','Pieza','Largo','Ancho','Esp.','Material']],
      body: pieces.map((p,i)=>[String(i+1).padStart(2,'0'),p.name,p.w,p.h,p.t,p.material||'MDP']),
      theme:'grid',
      headStyles:{fillColor:[30,20,5],textColor:GOLD,fontStyle:'bold',fontSize:6},
      alternateRowStyles:{fillColor:[20,16,8]},
      bodyStyles:{textColor:WHITE,fontSize:5.5,fillColor:[13,11,5]},
      columnStyles:{0:{cellWidth:10,halign:'center'},1:{cellWidth:58},2:{cellWidth:20,halign:'right'},3:{cellWidth:20,halign:'right'},4:{cellWidth:14,halign:'right'},5:{cellWidth:26}},
    });

    const np=doc.getNumberOfPages();
    for(let i=1;i<=np;i++){
      doc.setPage(i); doc.setFontSize(5); doc.setTextColor(...MUTED);
      doc.text(`${COMPANY} · Orbin AI v4.6 · Pág. ${i}/${np}`, PW/2, PH-8, {align:'center'});
    }

    const ts = Date.now();
    download(doc.output('blob'), `orbin-plano-ejecutivo-${ts}.pdf`);
    log(`Plano Ejecutivo PDF descargado — ${pieces.length} piezas`);
  } catch(e) { log('Error PDF: '+e.message,'err'); }
}

// ── 2. Thermal Labels PDF ──────────────────────────────────────────────────
function genThermal() {
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
    const PW=doc.internal.pageSize.getWidth(), PH=doc.internal.pageSize.getHeight();
    const pieces = extractPieces(MODULES);
    const LW=80, LH=50, COLS=2, MARGIN=8, GAP=5;
    let col=0, row=0, pageInit=true;

    pieces.forEach((piece,idx)=>{
      if(pageInit){ doc.setFillColor(...DARK); doc.rect(0,0,PW,PH,'F'); pageInit=false; }
      const x=MARGIN+col*(LW+GAP), y=MARGIN+row*(LH+GAP);
      if(y+LH > PH-MARGIN){ doc.addPage(); doc.setFillColor(...DARK); doc.rect(0,0,PW,PH,'F'); col=0; row=0; }
      const cx=MARGIN+col*(LW+GAP), cy=MARGIN+row*(LH+GAP);

      doc.setFillColor(20,16,8); doc.roundedRect(cx,cy,LW,LH,2,2,'F');
      doc.setDrawColor(...GOLD); doc.setLineWidth(0.5); doc.roundedRect(cx,cy,LW,LH,2,2);
      doc.setFillColor(...GOLD); doc.roundedRect(cx,cy,LW,7,2,2,'F'); doc.rect(cx,cy+3,LW,4,'F');
      doc.setFontSize(4.5); doc.setTextColor(...DARK); doc.setFont(undefined,'bold');
      doc.text(COMPANY.toUpperCase(), cx+LW/2, cy+4.5, {align:'center'});

      const uid=`ORB-${String(idx+1).padStart(3,'0')}-${(piece.moduleId||'XXXX').slice(-4).toUpperCase()}`;
      doc.setFontSize(7); doc.setTextColor(...GOLD); doc.setFont(undefined,'bold');
      doc.text(uid, cx+4, cy+13);
      doc.setFontSize(6.5); doc.setTextColor(...WHITE); doc.setFont(undefined,'bold');
      doc.text(piece.name, cx+4, cy+19, {maxWidth:LW-8});
      doc.setFontSize(10); doc.setTextColor(...GOLD); doc.setFont(undefined,'bold');
      doc.text(`${piece.w} × ${piece.h}`, cx+4, cy+28);
      doc.setFontSize(5.5); doc.setTextColor(...MUTED); doc.setFont(undefined,'normal');
      doc.text(`Esp: ${piece.t}mm`, cx+4, cy+33);

      const mat=piece.material||'MDP';
      doc.setFillColor(...GOLD); doc.setFontSize(5); doc.setTextColor(...DARK); doc.setFont(undefined,'bold');
      const mw=doc.getTextWidth(mat)+4;
      doc.roundedRect(cx+LW-mw-4,cy+29,mw,5,1,1,'F');
      doc.text(mat, cx+LW-6, cy+32.5, {align:'right'});

      doc.setFontSize(4.5); doc.setTextColor(...MUTED); doc.setFont(undefined,'normal');
      doc.text((piece.type||'structural').replace(/_/g,' ').toUpperCase(), cx+4, cy+38);
      doc.setDrawColor(50,40,15); doc.setLineWidth(0.15);
      doc.line(cx+2,cy+41,cx+LW-2,cy+41);
      doc.setFontSize(4); doc.setTextColor(70,60,20);
      doc.text(`Módulo: ${piece.moduleId||'—'}`, cx+4, cy+45);
      doc.text('Orbin AI v4.6', cx+LW-4, cy+45, {align:'right'});

      col++; if(col>=COLS){col=0;row++;}
    });

    download(doc.output('blob'), `orbin-etiquetas-termicas-${Date.now()}.pdf`);
    log(`Etiquetas Térmicas descargadas — ${pieces.length} etiquetas (${Math.ceil(pieces.length/2)} páginas)`);
  } catch(e){ log('Error Etiquetas: '+e.message,'err'); }
}

// ── 3. CSV Lista de Corte ──────────────────────────────────────────────────
function genCSV() {
  try {
    const pieces = extractPieces(MODULES);
    const E = 1; // 1mm tapacanto
    const edgeRules = {
      door:'all', drawer_front:'all',
      structural:'front', shelf:'front',
      drawer_box:'top', countertop:'front',
    };

    const rows = pieces.map((p,i)=>{
      const rule=edgeRules[p.type]||'none';
      const isWLong=p.w>=p.h;
      const largo=isWLong?p.w:p.h, ancho=isWLong?p.h:p.w;
      let nL=largo,nA=ancho,eL1='',eL2='',eA1='',eA2='';
      if(rule==='all'){nL-=2*E;nA-=2*E;eL1=eL2=eA1=eA2=`${E}mm`;}
      else if(rule==='front'){nL-=E;eL1=`${E}mm`;}
      else if(rule==='top'){nL-=E;eL1=`${E}mm`;}
      return [`"ORB-${String(i+1).padStart(3,'0')}"`,`"${p.name}"`,`"${p.type}"`,nL.toFixed(1),nA.toFixed(1),p.t,`"${p.material||'MDP'}"`,`"${eL1}"`,`"${eL2}"`,`"${eA1}"`,`"${eA2}"`].join(',');
    });

    const BOM='﻿';
    const header='ID,Nombre Pieza,Tipo,Largo Neto (mm),Ancho Neto (mm),Espesor (mm),Material,Tapacanto L1,Tapacanto L2,Tapacanto A1,Tapacanto A2';
    const csv=BOM+header+'\n'+rows.join('\n');
    download(new Blob([csv],{type:'text/csv;charset=utf-8'}), `orbin-lista-corte-${Date.now()}.csv`);
    log(`CSV Lista de Corte descargada — ${pieces.length} piezas con descuentos de tapacanto`);
  } catch(e){ log('Error CSV: '+e.message,'err'); }
}

// ── Generar los 3 en secuencia ─────────────────────────────────────────────
async function genAll() {
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  log('Iniciando generación de 3 artefactos...','info');
  await new Promise(r=>setTimeout(r,200)); genPDF();
  await new Promise(r=>setTimeout(r,800)); genThermal();
  await new Promise(r=>setTimeout(r,800)); genCSV();
  await new Promise(r=>setTimeout(r,400));
  log('✅ Los 3 artefactos descargados. Revisa tu carpeta de Descargas.','info');
  document.querySelectorAll('button').forEach(b=>b.disabled=false);
}
</script>
</body>
</html>
